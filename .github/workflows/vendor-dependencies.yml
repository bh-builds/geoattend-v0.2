name: Vendor browser dependencies

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download local dependencies and AI models
        run: node scripts/vendor-dependencies.mjs
      - name: Commit downloaded dependencies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor models
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
          else
            git commit -m "Vendor frontend dependencies and face models"
            git push
          fi
