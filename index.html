<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GeoAttend - Facial & GPS Attendance</title>
  <!-- Leaflet Map CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- face-api.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <!-- App Styles & Logic -->
  <link rel="stylesheet" href="style.css">
  <script defer src="app.js"></script>
</head>
<body>

  <main class="container">
    <!-- Dynamic Event Header -->
    <header class="header-card">
      <h1 id="eventTitle">Loading Event...</h1>
      <p id="locationSubtitle">Connecting to configuration...</p>
    </header>

    <!-- System Status Badges -->
    <section class="badges">
      <div id="aiBadge" class="badge">AI Models: Loading...</div>
      <div id="gpsBadge" class="badge">GPS: Waiting...</div>
    </section>

    <!-- Live Geofence Map -->
    <div id="map"></div>

    <!-- Camera Viewport -->
    <section class="video-wrapper">
      <video id="video" autoplay muted playsinline></video>
      <div id="camOverlay" class="video-overlay">
        <p>Tap below to enable Camera and GPS location for attendance verification.</p>
        <button id="btnStartSensors" class="btn-primary">Activate Camera & GPS</button>
      </div>
    </section>

    <div id="status" role="status">Initializing system...</div>

    <!-- Check-In / Check-Out Controls -->
    <section class="btn-group">
      <button id="btnClockIn" class="btn-primary" disabled>Clock In</button>
      <button id="btnClockOut" class="btn-danger" disabled>Clock Out</button>
    </section>

    <!-- New Participant Face Registration -->
    <section class="register-section">
      <h2>New Participant Registration</h2>
      <input type="text" id="regId" placeholder="NIP / Participant ID" autocomplete="off">
      <input type="text" id="regName" placeholder="Full Name" autocomplete="off">
      <button id="btnRegister" class="btn-success" disabled>Capture & Register Face</button>
    </section>

    <footer class="app-footer">
      <span id="versionInfo">GeoAttend • GitHub Frontend</span>
    </footer>
  </main>

</body>
</html>
