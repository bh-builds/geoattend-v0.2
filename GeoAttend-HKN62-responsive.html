<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- Explicitly allow camera & geolocation delegation -->
  <meta http-equiv="Permissions-Policy" content="camera=*, geolocation=*, microphone=*">
  <title>GeoAttend - Hari Kesehatan Nasional (HKN) ke 62</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f8f9fa;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .gate-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background: #ffffff;
      z-index: 20;
    }
    .gate-screen.hidden { display: none; }
    .gate-screen h2 { font-size: 20px; color: #1a73e8; margin-bottom: 8px; }
    .gate-screen p { font-size: 14px; color: #5f6368; max-width: 340px; margin-bottom: 20px; line-height: 1.5; }
    .btn-start {
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      background-color: #1a73e8;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(26, 115, 232, 0.3);
    }
    .btn-start:disabled { background: #dadce0; box-shadow: none; }
    #permError { color: #d93025; font-size: 13px; margin-top: 14px; max-width: 340px; }
    iframe {
      width: 100%;
      height: 100dvh;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Step 1: User-gesture gate to trigger native Camera & GPS prompts -->
  <div id="gate" class="gate-screen">
    <h2>GeoAttend HKN ke-62</h2>
    <p>Tap below to grant Camera and GPS Location access required for attendance verification.</p>
    <button id="btnStart" class="btn-start" onclick="requestPermissionsAndLoad()">
      Enable Camera & GPS
    </button>
    <div id="permError"></div>
  </div>

  <!-- Step 2: Target iframe (src injected after permissions are granted) -->
  <iframe
    id="appFrame"
    allow="camera https://script.google.com https://*.googleusercontent.com; geolocation https://script.google.com https://*.googleusercontent.com"
    allowfullscreen>
  </iframe>

  <script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz1l_aMFoI6UyxQDz6i1mP2PuFLLXXbGOdgEoRGGhBOpCU3JcaiNm4oJkTvj9T6M2pjJg/exec";

    async function requestPermissionsAndLoad() {
      const btn = document.getElementById('btnStart');
      const errEl = document.getElementById('permError');
      btn.disabled = true;
      btn.innerText = "Requesting access...";
      errEl.innerText = "";

      try {
        // 1. Trigger Camera prompt via user gesture
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user' },
          audio: false
        });
        // Release the test stream immediately so the iframe can claim the camera
        stream.getTracks().forEach(track => track.stop());

        // 2. Trigger Geolocation prompt via user gesture
        await new Promise((resolve, reject) => {
          navigator.geolocation.getCurrentPosition(resolve, reject, {
            enableHighAccuracy: true,
            timeout: 10000
          });
        });

        // 3. Load the Apps Script iframe now that permissions are cached
        document.getElementById('appFrame').src = GAS_WEB_APP_URL;
        document.getElementById('gate').classList.add('hidden');

      } catch (err) {
        btn.disabled = false;
        btn.innerText = "Retry Camera & GPS";
        errEl.innerText = `Access denied or unavailable (${err.message}). Please allow Camera and Location in your browser site settings and ensure you are using HTTPS.`;
      }
    }
  </script>

</body>
</html>
